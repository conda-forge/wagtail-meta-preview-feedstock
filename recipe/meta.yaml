{% set name = "wagtail-meta-preview" %}
{% set version = "5.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 62dbe4c815e13f3885d2a914866cb1521784efcc15d19e58196671df5ed5c0a1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - wheel
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - wagtail >=5.2

test:
  imports:
    - wagtail_meta_preview
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Frojd/wagtail-meta-preview
  summary: Add preview panels for meta data to wagtail
  dev_url: https://github.com/Frojd/wagtail-meta-preview/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
